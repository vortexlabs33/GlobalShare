name: Build GlobalXender APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Project & Generate Android
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          npx cap init GlobalXender com.globalxender.app --web-dir www
          
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi

          # Add android platform fresh
          npx cap add android

          # Inject our custom AppListPlugin.java into the generated Android project
          mkdir -p android/app/src/main/java/com/vortexlabs/globalshare/
          
          # Create AppListPlugin.java
          cat << 'EOF' > android/app/src/main/java/com/vortexlabs/globalshare/AppListPlugin.java
          package com.vortexlabs.globalshare;

          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "AppList")
          public class AppListPlugin extends Plugin {

              @PluginMethod
              public void getInstalledApps(PluginCall call) {
                  PackageManager pm = getContext().getPackageManager();
                  List<ApplicationInfo> packages = pm.getInstalledApplications(PackageManager.GET_META_DATA);
                  JSArray appList = new JSArray();

                  for (ApplicationInfo packageInfo : packages) {
                      // Filter out system apps if desired, or keep all user apps
                      if ((packageInfo.flags & ApplicationInfo.FLAG_SYSTEM) == 0) {
                          JSObject appObj = new JSObject();
                          appObj.put("name", pm.getApplicationLabel(packageInfo).toString());
                          appObj.put("packageName", packageInfo.packageName);
                          appObj.put("path", packageInfo.sourceDir);
                          appList.put(appObj);
                      }
                  }

                  JSObject ret = new JSObject();
                  ret.put("apps", appList);
                  call.resolve(ret);
              }
          }
          EOF

          # Update MainActivity.java to register the plugin
          cat << 'EOF' > android/app/src/main/java/com/vortexlabs/globalshare/MainActivity.java
          package com.vortexlabs.globalshare;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(AppListPlugin.class);
              }
          }
          EOF

          npx cap sync android

      - name: Grant Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalXender-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

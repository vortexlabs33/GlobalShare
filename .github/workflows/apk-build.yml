name: Build GlobalXender APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Removed cache parameter to prevent pre-build warnings

      - name: Initialize Capacitor Project & Web Assets
        run: |
          npm init -y
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          npx cap init GlobalXender com.globalxender.app --web-dir www
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi
          npx cap add android
          npx cap sync android

      - name: Grant Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalXender-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

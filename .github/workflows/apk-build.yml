name: Build GlobalShare APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Setup Android
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi

          # Force clean and add the android platform so files are guaranteed to exist
          rm -rf android
          npx cap add android

          # Safely inject AndroidManifest.xml queries permission if missing
          python3 -c '
          import os
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  content = f.read()

              queries_tag = """
                  <queries>
                      <intent>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent>
                  </queries>
              """

              if "<queries>" not in content:
                  content = content.replace("<application", queries_tag + "\n    <application")
                  with open(manifest_path, "w") as f:
                      f.write(content)
          '

          npx cap sync android

      - name: Grant Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalShare-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

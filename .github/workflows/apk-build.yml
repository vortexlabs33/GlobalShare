name: Build GlobalShare APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Project & Generate Android
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          npx cap init GlobalShare com.globalshare.app --web-dir www
          
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi

          # Clear any existing android folder to prevent conflicts, then add fresh
          rm -rf android
          npx cap add android

          # Inject our custom AppListPlugin.java into the correct unified package path
          mkdir -p android/app/src/main/java/com/globalshare/app/
          
          # Create AppListPlugin.java using queryIntentActivities for reliable app scanning
          cat << 'EOF' > android/app/src/main/java/com/globalshare/app/AppListPlugin.java
          package com.globalshare.app;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "AppList")
          public class AppListPlugin extends Plugin {

              @PluginMethod
              public void getInstalledApps(PluginCall call) {
                  PackageManager pm = getContext().getPackageManager();
                  Intent intent = new Intent(Intent.ACTION_MAIN, null);
                  intent.addCategory(Intent.CATEGORY_LAUNCHER);
                  
                  List<ResolveInfo> resolveInfos = pm.queryIntentActivities(intent, 0);
                  JSArray appList = new JSArray();

                  for (ResolveInfo resolveInfo : resolveInfos) {
                      JSObject appObj = new JSObject();
                      appObj.put("name", resolveInfo.loadLabel(pm).toString());
                      appObj.put("packageName", resolveInfo.activityInfo.packageName);
                      appObj.put("path", resolveInfo.activityInfo.applicationInfo.sourceDir);
                      appList.put(appObj);
                  }

                  JSObject ret = new JSObject();
                  ret.put("apps", appList);
                  call.resolve(ret);
              }
          }
          EOF

          # Update MainActivity.java to register the plugin under the matching package
          cat << 'EOF' > android/app/src/main/java/com/globalshare/app/MainActivity.java
          package com.globalshare.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(AppListPlugin.class);
              }
          }
          EOF

          # Inject AndroidManifest.xml queries permission for launcher intents
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          queries_tag = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          """

          if "<queries>" not in content:
              content = content.replace("<application", queries_tag + "\n    <application")
              with open(manifest_path, "w") as f:
                  f.write(content)
          '

          npx cap sync android

      - name: Grant Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalShare-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
